---
name: build
'on':
  pull_request:
    paths: &paths
      - .github/workflows/build.yml
      - CMakeLists.txt
      - cmake/**
      - include/**
      - src/**
  push:
    branches: [master]
    paths: *paths
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: sh
jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - macos-15-intel
          - macos-26
          - ubuntu-24.04
          - ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build --parallel
      - run: |
          out=$(printf 'i3412i1234wbcq' | ./build/src/atm)
          printf '%s\n' "$out"
          for msg in 'PIN incorrect' 'Issuing 50' 'Cancelled'; do
            printf '%s\n' "$out" | grep --fixed-strings --quiet "$msg"
          done
